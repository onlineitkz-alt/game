<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Star Catcher</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; }
  #wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { background: linear-gradient(#10183a, #1b2a5e); border-radius: 12px; box-shadow: 0 0 40px #000a; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
// Phone = touch device with a small screen -> portrait. Otherwise -> landscape.
const isPhone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820;
const W = isPhone ? 360 : 960;
const H = isPhone ? 640 : 540;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// Try to lock orientation (works on some phones after fullscreen)
function tryLock() {
  try {
    if (isPhone && screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {});
  } catch (e) {}
}

const player = { x: W / 2, w: isPhone ? 80 : 110, h: 16 };
let items, score, lives, t, running = false, best = +(localStorage.getItem('best') || 0);
const keys = {};

function reset() { items = []; score = 0; lives = 3; t = 0; running = true; }

function px(clientX) {
  const r = cv.getBoundingClientRect();
  return (clientX - r.left) * (W / r.width);
}
addEventListener('mousemove', e => { player.x = px(e.clientX); });
addEventListener('touchmove', e => { player.x = px(e.touches[0].clientX); }, { passive: true });
addEventListener('touchstart', e => { player.x = px(e.touches[0].clientX); if (!running) { tryLock(); reset(); } }, { passive: true });
addEventListener('mousedown', () => { if (!running) reset(); });
addEventListener('keydown', e => { keys[e.key] = true; if (!running && (e.key === ' ' || e.key === 'Enter')) reset(); });
addEventListener('keyup', e => { keys[e.key] = false; });

function spawn() {
  const bomb = Math.random() < 0.22;
  items.push({ x: 20 + Math.random() * (W - 40), y: -20, v: 2 + Math.random() * 2 + score * 0.04, bomb });
}

function update() {
  t++;
  if (keys['ArrowLeft'] || keys['a']) player.x -= 8;
  if (keys['ArrowRight'] || keys['d']) player.x += 8;
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
  if (t % Math.max(18, 45 - Math.floor(score / 5)) === 0) spawn();
  const py = H - 40;
  for (const it of items) it.y += it.v;
  items = items.filter(it => {
    const hit = it.y > py - 10 && it.y < py + player.h && Math.abs(it.x - player.x) < player.w / 2 + 8;
    if (hit) {
      if (it.bomb) lives--; else score++;
      return false;
    }
    if (it.y > H + 20) { if (!it.bomb) lives--; return false; }
    return true;
  });
  if (lives <= 0) {
    running = false;
    if (score > best) { best = score; localStorage.setItem('best', best); }
  }
}

function drawStar(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const it of items) {
    if (it.bomb) {
      ctx.fillStyle = '#ff4d5e'; ctx.beginPath(); ctx.arc(it.x, it.y, 12, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(it.x - 1.5, it.y - 20, 3, 8);
    } else { ctx.fillStyle = '#ffd84d'; drawStar(it.x, it.y, 14); }
  }
  ctx.fillStyle = '#4de1ff';
  ctx.fillRect(player.x - player.w / 2, H - 40, player.w, player.h);

  ctx.fillStyle = '#fff'; ctx.font = '20px system-ui'; ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 14, 28);
  ctx.textAlign = 'right';
  ctx.fillText('♥'.repeat(Math.max(lives, 0)), W - 14, 28);

  if (!running) {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 36px system-ui';
    ctx.fillText(t ? 'Game Over' : 'Star Catcher', W / 2, H / 2 - 40);
    ctx.font = '20px system-ui';
    if (t) ctx.fillText('Score: ' + score, W / 2, H / 2);
    ctx.fillText('Best: ' + best, W / 2, H / 2 + 28);
    ctx.fillText(isPhone ? 'Tap to start · drag to move' : 'Click / Space to start · mouse or ←/→ to move', W / 2, H / 2 + 70);
    ctx.font = '14px system-ui';
    ctx.fillText('Catch stars, avoid red bombs. Missing a star costs a life.', W / 2, H / 2 + 100);
  }
}

(function loop() {
  if (running) update();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
