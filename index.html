<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; overflow: hidden; touch-action: none;
    font-family: system-ui, sans-serif; color: #e2e8f0; -webkit-user-select: none; user-select: none; }
  #wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { background: #111c33; border-radius: 12px; box-shadow: 0 0 0 2px #1e293b, 0 10px 40px #0008; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
const CELL = 30;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Phone -> vertical (portrait) field. Computer/laptop -> horizontal (landscape) field.
function isPhone() {
  const coarse = matchMedia('(pointer: coarse)').matches;
  return innerWidth < 600 || (coarse && Math.min(innerWidth, innerHeight) < 700);
}

let mode, cols, rows, snake, dir, nextDir, food, score, best = 0, state = 'ready', acc = 0, last = 0;
try { best = +localStorage.getItem('snakeBest') || 0; } catch (e) {}

function setup() {
  const portrait = isPhone();
  const m = portrait ? 'portrait' : 'landscape';
  cols = portrait ? 12 : 32;
  rows = portrait ? 21 : 18;
  canvas.width = cols * CELL;
  canvas.height = rows * CELL;
  fit();
  if (m !== mode) { mode = m; reset(); }
}

function fit() {
  const pad = 16;
  const s = Math.min((innerWidth - pad) / canvas.width, (innerHeight - pad) / canvas.height);
  canvas.style.width = canvas.width * s + 'px';
  canvas.style.height = canvas.height * s + 'px';
}

function reset() {
  const cx = cols >> 1, cy = rows >> 1;
  snake = [{x: cx, y: cy}, {x: cx - 1, y: cy}, {x: cx - 2, y: cy}];
  dir = nextDir = {x: 1, y: 0};
  score = 0; state = 'ready';
  placeFood();
}

function placeFood() {
  do { food = {x: Math.random() * cols | 0, y: Math.random() * rows | 0}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}

function turn(x, y) {
  if (x === -dir.x && y === -dir.y) return;
  nextDir = {x, y};
  if (state === 'ready' || state === 'over') start();
}

function start() { if (state === 'over') reset(); state = 'play'; }

function step() {
  dir = nextDir;
  const h = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (h.x < 0 || h.y < 0 || h.x >= cols || h.y >= rows || snake.some(s => s.x === h.x && s.y === h.y)) {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('snakeBest', best); } catch (e) {} }
    return;
  }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) { score++; placeFood(); } else snake.pop();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#16233f';
  for (let x = 0; x < cols; x++) for (let y = 0; y < rows; y++)
    if ((x + y) % 2) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
  ctx.fillStyle = '#f43f5e';
  ctx.beginPath(); ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.36, 0, 7); ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i ? '#22c55e' : '#86efac';
    ctx.beginPath(); ctx.roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, 8); ctx.fill();
  });
  ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'left';
  ctx.fillText('Score ' + score + '   Best ' + best, 12, 26);
  if (state !== 'play') {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 36px system-ui';
    ctx.fillText(state === 'over' ? 'Game over' : 'Snake', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '20px system-ui';
    ctx.fillText(mode === 'portrait' ? 'Swipe to ' + (state === 'over' ? 'restart' : 'start')
                                      : 'Arrow keys / WASD to ' + (state === 'over' ? 'restart' : 'start'),
                 canvas.width / 2, canvas.height / 2 + 24);
  }
}

function loop(t) {
  acc += t - last; last = t;
  while (acc >= 110) { acc -= 110; if (state === 'play') step(); }
  draw();
  requestAnimationFrame(loop);
}

// Keyboard
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') turn(0, -1);
  else if (k === 'arrowdown' || k === 's') turn(0, 1);
  else if (k === 'arrowleft' || k === 'a') turn(-1, 0);
  else if (k === 'arrowright' || k === 'd') turn(1, 0);
  else return;
  e.preventDefault();
});

// Swipe
let sx, sy;
addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
addEventListener('touchmove', e => {
  if (sx == null) return;
  const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive: true});
addEventListener('touchend', () => { sx = null; });

addEventListener('resize', setup);
addEventListener('orientationchange', () => setTimeout(setup, 200));

setup();
requestAnimationFrame(t => { last = t; loop(t); });
</script>
</body>
</html>
